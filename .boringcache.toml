workspace = "boringcache/asterinas"

# `make kernel` drives Cargo from inside the container, so there is no Cargo
# command for the action to wrap. Archive the build state it produces instead.
[entries.cargo-registry-cache]
path = "/root/.cargo/registry/cache"
tag = "asterinas-cargo-registry-cache"

[entries.cargo-registry-index]
path = "/root/.cargo/registry/index"
tag = "asterinas-cargo-registry-index"

[entries.cargo-git-db]
path = "/root/.cargo/git/db"
tag = "asterinas-cargo-git-db"

[entries.kernel-target]
path = "target"
tag = "asterinas-kernel-target"

[profiles.kernel]
# The kernel-dev image ships its own populated Cargo registry, and a restore
# refuses a non-empty destination, so cache only what the build produces.
entries = ["kernel-target"]
